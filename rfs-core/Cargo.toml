[package]
name = "rfs-core"
version = "0.4.0"
edition = "2021"
description = "Shared types and networking for RFS engine (0.3.2 fork, wire protocol v2 — NOT compatible with 0.3.x)"

[dependencies]
glam = { version = "0.28", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
bincode = "1"
