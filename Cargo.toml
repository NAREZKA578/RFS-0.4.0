[package]
name = "rfs-client"
version = "0.1.0"
edition = "2021"
authors = ["RFS Team"]
description = "Client-side rendering for RFS naval combat game"
license = "Proprietary"

[dependencies]
# RHI - our own rendering abstraction
rhi = { path = "src/rhi" }

# Math
glam = "0.26"

# Windowing
#
# Accepted decision (plan, part G): the window comes from a ready-made library,
# not hand-rolled. `default-features = false` because the project is Windows
# only, so the Wayland and X11 backends are dead weight; `rwh_06` selects the
# raw-window-handle version that `Renderer` uses to obtain the Win32 handles
# `ash` needs for a VkSurfaceKHR.
winit = { version = "0.29", default-features = false, features = ["rwh_06"] }
raw-window-handle = "0.6"



# Image loading (for texture loading)
# image = "0.24"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
# tracing = "0.1"
# tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Random
rand = "0.8"

[profile.dev]
opt-level = 1
debug = true
debug-assertions = true
overflow-checks = true

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.release-with-debug]
inherits = "release"
debug = true
debug-assertions = true

[workspace]
members = [
    "src/rhi",
    ".",
]

[workspace.dependencies]
# RHI dependencies
rhi = { path = "src/rhi" }
