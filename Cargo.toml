[package]
name = "rfs-client"
version = "0.1.0"
edition = "2021"
authors = ["RFS Team"]
description = "Client-side rendering for RFS naval combat game"
license = "Proprietary"

[dependencies]
# RHI - our own rendering abstraction
rhi = { path = "src/rhi" }

# Math
glam = "0.26"

# Windowing
#
# Accepted decision (plan, part G): the window comes from a ready-made library,
# not hand-rolled. `default-features = false` because the project is Windows
# only, so the Wayland and X11 backends are dead weight; `rwh_06` selects the
# raw-window-handle version that `Renderer` uses to obtain the Win32 handles
# `ash` needs for a VkSurfaceKHR.
winit = { version = "0.29", default-features = false, features = ["rwh_06"] }
raw-window-handle = "0.6"

# Image loading (for texture loading)
# image = "0.24"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
# tracing = "0.1"
# tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Random
rand = "0.8"

# Font parsing and rasterising for the UI's real typefaces (see
# src/render/ui/fonts.rs). Pure Rust; the font files themselves sit in
# Tool/client_tests/assets/fonts under the SIL OFL 1.1.
ab_glyph = "0.2"

# The server protocol stack. The same crates the stress bots speak, so the
# menu's Play can put a live `rfs_net::NetClient` on the wire against the
# dedicated server. Path dependencies into the server workspace on purpose
# (the Tool harness already does this): one protocol source, two consumers.
rfs_core = { path = "server_src/crates/core" }
rfs_net = { path = "server_src/crates/net" }
# The bridge's own runtime: a dedicated thread drives the net client's
# internal tasks on a current-thread reactor; the render loop never awaits.
# The feature set is declared once in [workspace.dependencies] below and
# inherited here.
tokio = { workspace = true }

[profile.dev]
opt-level = 1
debug = true
debug-assertions = true
overflow-checks = true

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.release-with-debug]
inherits = "release"
debug = true
debug-assertions = true

[workspace]
# `server_src` is its own workspace (7 crates with their own
# workspace.dependencies). It sits inside this directory tree, so cargo
# would otherwise treat every crate in it as a member of THIS workspace and
# resolve their `workspace = true` inheritance against this manifest — which
# does not carry their dependencies. The explicit exclude marks the tree as
# foreign, and the path dependencies into it (see rfs_core/rfs_net above)
# resolve against server_src's own root, exactly as the Tool harness does.
exclude = ["server_src"]
members = [
    "src/rhi",
    ".",
]

[workspace.dependencies]
# RHI dependencies
rhi = { path = "src/rhi" }

# The specs below mirror `server_src/Cargo.toml`'s [workspace.dependencies]
# on purpose. Cargo resolves the `workspace = true` inheritance of the path
# dependencies that live inside this directory tree (rfs_core, rfs_net,
# pulled by the menu's Play) against THIS manifest, and `workspace.exclude`
# does not lift that — a nested workspace's own [workspace.dependencies] is
# only consulted when the depending package sits outside the tree. The
# mirror is load-bearing: a version changed here and the same crate builds
# against different dependency versions depending on which workspace pulled
# it. Keep the two lists in lockstep.
# Deliberate deviation: `tokio` carries only the drivers the client needs
# (net, sync, time, the bridge's rt and select! macros) instead of the
# server's `full`; the version stays the same.
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
postcard = { version = "1.0", default-features = false, features = ["alloc"] }
bytemuck = { version = "1.15", features = ["derive"] }
glam = "0.26"
bitflags = { version = "2.5", features = ["serde"] }
smallvec = { version = "1.11", features = ["serde"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
tokio = { version = "1.38", features = ["net", "sync", "time", "rt", "macros"] }
parking_lot = "0.12"
tracing = "0.1"
anyhow = "1.0"
thiserror = "1.0"
# rfs_net's dev-dependency: the manifest must parse for the client build too,
# even though the consumer never compiles a dependency's dev-deps.
criterion = "0.5"
