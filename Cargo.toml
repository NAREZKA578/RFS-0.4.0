[workspace]
resolver = "2"
members = ["rfs-core", "rfs-engine-render", "rfs-engine-net", "rfs-sim"]

[workspace.dependencies]
glam = { version = "0.28", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
anyhow = "1"
rfs-core = { path = "rfs-core", version = "0.4.0" }
