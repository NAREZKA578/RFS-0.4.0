[package]
name = "rhi"
version = "0.1.0"
edition = "2021"
authors = ["RFS Team"]
description = "Rendering Hardware Interface - abstraction layer for graphics APIs"
license = "Proprietary"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# Bit manipulation
bitflags = { version = "2.0", features = ["serde"] }

[lib]
name = "rhi"
path = "lib.rs"

[features]
default = ["vulkan", "d3d12", "d3d11", "opengl"]
vulkan = []
d3d12 = []
d3d11 = []
opengl = []
ray_tracing = []

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
