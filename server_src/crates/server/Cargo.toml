[package]
name = "rfs_server"
version = "0.1.0"
edition = "2021"

[dependencies]
rfs_core = { path = "../core" }
rfs_net = { path = "../net" }
rfs_sim = { path = "../sim" }
rfs_ship = { path = "../ship" }
rfs_damage = { path = "../damage" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
parking_lot = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[lib]
name = "rfs_server"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
# План H5: «считать память сервера» — рабочее множество процесса читается
# напрямую (GetProcessMemoryInfo) и попадает в `perf:` строку (main.rs,
# working_set_mb); никаких оценок.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }