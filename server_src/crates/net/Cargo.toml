[package]
name = "rfs_net"
version = "0.1.0"
edition = "2021"

[dependencies]
rfs_core = { path = "../core" }
serde = { workspace = true, features = ["derive"] }
bincode = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true, features = ["net", "sync", "time"] }
parking_lot = { workspace = true }
smallvec = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
rayon = "1"
# Bug №700: per-datagram authenticity. HMAC-SHA256 (truncated to 16 bytes)
# over each datagram with a shared secret from the match config, plus a
# per-source sequence for replay refusal. Integrity only — payload secrecy
# remains an open plan item, not silently implied by these crates.
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
# The crate itself only needs net/sync/time; the end-to-end tests need a
# runtime and #[tokio::test].
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
criterion = { workspace = true }

[[bench]]
name = "delta"
harness = false